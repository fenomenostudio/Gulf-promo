<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  .hero {
    width: 1200px; height: 675px;
    position: relative; overflow: hidden;
    background: #FFFFFF;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .stripes {
    position: absolute; top: -500px; right: -300px;
    width: 620px; height: 1400px;
    transform: rotate(24deg);
    display: flex;
  }
  .s-light { width: 150px; height: 100%; background: #B9D9EB; }
  .s-orange { width: 75px; height: 100%; background: #FF6319; }
  .s-blue { width: 190px; height: 100%; background: #002776; }

  .stripes2 {
    position: absolute; bottom: -500px; left: -340px;
    width: 620px; height: 1400px;
    transform: rotate(24deg);
    display: flex;
  }
  .content { position: relative; z-index: 2; text-align: center; }
  .txt {
    color: #002776; font-size: 110px; font-weight: 800;
    letter-spacing: -2px; line-height: 1;
  }
  .content img { height: 250px; width: auto; margin-top: 26px; }
  .ig {
    margin-top: 30px;
    display: flex; align-items: center; justify-content: center; gap: 14px;
  }
  .ig svg { width: 44px; height: 44px; }
  .ig .handle { color: #002776; font-size: 40px; font-weight: 700; }
</style>
</head>
<body>
<div class="hero" id="hero">
  <div class="stripes">
    <div class="s-light"></div><div class="s-orange"></div><div class="s-blue"></div>
  </div>
  <div class="stripes2">
    <div class="s-blue"></div><div class="s-orange"></div><div class="s-light"></div>
  </div>
  <div class="content">
    <div class="txt">Gana con</div>
    <img src="gulf-logo-disc-transparent.png" alt="Gulf">
    <div class="ig">
      <svg viewBox="0 0 24 24" fill="none" stroke="#002776" stroke-width="1.8">
        <rect x="2.5" y="2.5" width="19" height="19" rx="5.5"/>
        <circle cx="12" cy="12" r="4.6"/>
        <circle cx="17.6" cy="6.4" r="1.3" fill="#002776" stroke="none"/>
      </svg>
      <div class="handle">@gulfoilguatemala</div>
    </div>
  </div>
</div>
</body>
</html>
