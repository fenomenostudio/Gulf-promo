<script>
(function () {
  var root = document.documentElement;
  var ENCENDER = 200;
  var APAGAR = 60;
  var BLOQUEO = 500;
  var SALTO_SOSPECHOSO = 250;
  var activo = false;
  var hasta = 0;
  var ultima = 0;
  var pendiente = false;

  function y() {
    return window.pageYOffset || root.scrollTop || 0;
  }

  function scrollBloqueado() {
    var b = document.body;
    if (!b) return false;
    if (b.style.position === 'fixed') return true;
    var cs = window.getComputedStyle(b);
    if (cs.position === 'fixed') return true;
    if (cs.overflow === 'hidden' || cs.overflowY === 'hidden') return true;
    return false;
  }

  function evaluar() {
    pendiente = false;
    var ahora = Date.now();
    if (ahora < hasta) return;

    var pos = y();
    var debe = activo ? pos > APAGAR : pos > ENCENDER;
    if (debe === activo) { ultima = pos; return; }

    if (activo && !debe) {
      if (scrollBloqueado()) return;
      if (ultima - pos > SALTO_SOSPECHOSO) return;
    }

    activo = debe;
    ultima = pos;
    hasta = ahora + BLOQUEO;
    if (debe) root.setAttribute('data-gulf-scroll', 'on');
    else root.removeAttribute('data-gulf-scroll');
  }

  function alScroll() {
    if (pendiente) return;
    pendiente = true;
    window.requestAnimationFrame(evaluar);
  }

  window.addEventListener('scroll', alScroll, { passive: true });
  evaluar();
})();
</script>
